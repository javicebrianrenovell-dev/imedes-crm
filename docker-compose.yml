version: '3.8'

services:
  crm-imedes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: imedes-crm:latest
    container_name: imedes-crm
    restart: unless-stopped
    ports:
      - "3100:3000"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm-imedes.rule=Host(`${DOMAIN_URL}`)"
      - "traefik.http.routers.crm-imedes.entrypoints=web,websecure"
      - "traefik.http.services.crm-imedes.loadbalancer.server.port=3000"
      - "traefik.http.routers.crm-imedes.tls=true"
      - "traefik.http.routers.crm-imedes.tls.certresolver=letsencrypt"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-"IMEDES CRM"}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-"http://localhost:3000"}
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true
