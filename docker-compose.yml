version: '3.8'

networks:
  dokploy-network:
    external: true

services:
  crm-imedes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: imedes-crm:latest
    container_name: imedes-crm
    restart: unless-stopped
    ports:
      - "3005:3000"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crmimedes.rule=Host(`${DOMAIN_URL}`)"
      - "traefik.http.routers.crmimedes.entrypoints=web,websecure"
      - "traefik.http.services.crmimedes.loadbalancer.server.port=3000"
      - "traefik.http.routers.crmimedes.tls=true"
      - "traefik.http.routers.crmimedes.tls.certresolver=letsencrypt"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-"IMEDES CRM"}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-"http://localhost:3000"}
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
